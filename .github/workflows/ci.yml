name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t relay-ci .
      - name: Starts read-only and answers /status
        run: |
          docker run -d --name relay-ci --read-only --cap-drop ALL -p 8080:8080 relay-ci
          for i in $(seq 1 20); do curl -sf localhost:8080/status && break; sleep 1; done
          curl -sf localhost:8080/status | grep -q '"delivery_log":false'
